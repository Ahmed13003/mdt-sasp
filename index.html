<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>SASP MDT - ULTIMATE</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="wallpaper"></div>

    <div id="login-overlay">
        <div class="auth-box">
            <img src="https://i.imgur.com/wasey9r.png" alt="SASP Logo" class="login-logo" style="width:120px; margin-bottom:20px;">
            <div class="brand" style="font-size:1.5rem; font-weight:bold; margin-bottom:20px;">SASP SERVICES</div>
            <div id="auth-fields">
                <input type="text" id="officer-id" placeholder="MATRICULE">
                <input type="password" id="access-code" placeholder="MOT DE PASSE">
                <button onclick="checkLogin()">CONNEXION AU TERMINAL</button>
                <p onclick="toggleRegister(true)" style="color:var(--accent); cursor:pointer; margin-top:20px; text-decoration:underline;">DEMANDER UN ACCÈS</p>
            </div>
            <div id="register-fields" style="display:none;">
                <input type="text" id="reg-prenom" placeholder="PRÉNOM">
                <input type="text" id="reg-nom" placeholder="NOM">
                <input type="text" id="reg-mat" placeholder="MATRICULE">
                <input type="password" id="reg-pass" placeholder="MOT DE PASSE">
                <button onclick="handleRegister()">ENVOYER LA DEMANDE</button>
                <p onclick="toggleRegister(false)" style="color:gray; cursor:pointer; margin-top:20px;">RETOUR</p>
            </div>
        </div>
    </div>

    <div id="mdt-app">
        <div class="sidebar">
            <div class="logo-area">
                <img src="https://i.imgur.com/wasey9r.png" alt="Logo" class="sidebar-logo">
                <div class="brand">SASP MDT v4.0</div>
            </div>
            
            <div id="service-btn" class="service-status" onclick="toggleService()">HORS SERVICE</div>
            <div id="panic-btn" onclick="triggerPanic()">PANIC BUTTON</div>
            
            <nav style="margin-top:20px;">
                <div class="nav-item active" data-page="page-dashboard"><i class="fas fa-th-large"></i> DASHBOARD</div>
                <div class="nav-item" data-page="page-citoyens"><i class="fas fa-address-book"></i> FICHIER CIVIL</div>
                <div class="nav-item" data-page="page-penal"><i class="fas fa-gavel"></i> CODE PÉNAL</div>
                <div class="nav-item" data-page="page-bolo"><i class="fas fa-car-burst"></i> BOLO</div>
                <div class="nav-item" data-page="page-effectifs"><i class="fas fa-user-shield"></i> EFFECTIF</div>
            </nav>

            <div class="officer-card" style="margin-top:auto; padding:20px; border-top:1px solid var(--border);">
                <p id="display-name" style="font-weight:bold;"></p>
                <p id="display-rank" style="color:var(--accent); font-size:0.8rem;"></p>
            </div>
        </div>

        <main class="content">
            <section id="page-dashboard" class="mdt-page">
                <h1>Tableau de Bord</h1>
                <div class="grid">
                    <div class="card">
                        <h3><i class="fas fa-tower-broadcast"></i> UNITÉS EN SERVICE</h3>
                        <div id="list-units" style="font-size:1.2rem; margin-top:15px;"></div>
                    </div>
                    <div class="card">
                        <h3><i class="fas fa-triangle-exclamation"></i> ALERTES RÉCENTES</h3>
                        <div id="dash-bolo"></div>
                    </div>
                </div>
            </section>

            <section id="page-penal" class="mdt-page" style="display:none;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h1>Code Pénal Officiel</h1>
                    <a href="https://docs.google.com/spreadsheets/d/1y8_DfJ5J2IZmJUKPhc2HxbjzdUaMcxbdg1fYA-dF8EI/edit?usp=sharing" target="_blank" style="color:var(--accent);">Plein écran ↗</a>
                </div>
                <div class="card" style="padding:0;">
                    <iframe src="https://docs.google.com/spreadsheets/d/1y8_DfJ5J2IZmJUKPhc2HxbjzdUaMcxbdg1fYA-dF8EI/preview"></iframe>
                </div>
            </section>

            <section id="page-citoyens" class="mdt-page" style="display:none;">
                <h1>Fichier Civil</h1>
                <div class="card">
                    <h3>Enregistrer un citoyen</h3>
                    <div class="grid" style="grid-template-columns:1fr 1fr; margin-bottom:15px;">
                        <input type="text" id="civ-prenom" placeholder="Prénom">
                        <input type="text" id="civ-nom" placeholder="Nom">
                    </div>
                    <button onclick="addCivil()">VALIDER L'ENTRÉE</button>
                </div>
                <div id="list-citoyens" class="grid"></div>
            </section>

            <section id="page-effectifs" class="mdt-page" style="display:none;">
                <h1>Effectif SASP</h1>
                <div id="form-sasp" class="card" style="display:none;">
                    <h3>Ajouter un Agent</h3>
                    <input type="text" id="new-prenom" placeholder="Prénom">
                    <input type="text" id="new-nom" placeholder="Nom">
                    <input type="text" id="new-mat" placeholder="Matricule">
                    <input type="text" id="new-grade" placeholder="Grade">
                    <button onclick="addNewAgent()">RECRUTER</button>
                </div>
                <div id="list-sasp" class="grid"></div>
            </section>
        </main>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
