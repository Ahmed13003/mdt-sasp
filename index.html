<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>SASP MDT - Système Officiel</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="wallpaper"></div>

    <div id="login-overlay">
        <div class="auth-box">
            <div class="brand">SASP SERVICES</div>
            <input type="text" id="officer-id" placeholder="MATRICULE">
            <input type="password" id="access-code" placeholder="MOT DE PASSE">
            <button onclick="checkLogin()">SE CONNECTER</button>
        </div>
    </div>

    <div id="mdt-app" style="display:none;">
        <div class="sidebar">
            <div class="brand">SASP MDT</div>
            <div id="service-btn" class="service-status" onclick="toggleService()">HORS SERVICE</div>
            
            <nav>
                <div class="nav-item active" data-page="page-dashboard"><i class="fas fa-home"></i> Dashboard</div>
                <div class="nav-item" data-page="page-annonces"><i class="fas fa-bullhorn"></i> Annonces</div>
                <div class="nav-item" data-page="page-citoyens"><i class="fas fa-users"></i> Fichier Civil</div>
                <div class="nav-item" data-page="page-effectifs"><i class="fas fa-shield-halved"></i> Effectif SASP</div>
            </nav>

            <div class="officer-card">
                <p id="display-name"></p>
                <p id="display-rank"></p>
            </div>
        </div>

        <main class="content">
            <section id="page-dashboard" class="mdt-page">
                <h1>Tableau de Bord</h1>
                <div class="grid">
                    <div class="card">
                        <h3><i class="fas fa-radio"></i> Unités en Service</h3>
                        <div id="list-units"></div>
                    </div>
                    <div class="card">
                        <h3><i class="fas fa-skull-crossbones"></i> Avis de Recherche</h3>
                        <div id="list-wanted-dash"></div>
                    </div>
                </div>
            </section>

            <section id="page-annonces" class="mdt-page" style="display:none;">
                <h1>Annonces Officielles</h1>
                <div class="card" id="form-annonce" style="display:none;">
                    <input type="text" id="ann-titre" placeholder="Titre de l'annonce">
                    <textarea id="ann-texte" placeholder="Message..." rows="3"></textarea>
                    <button onclick="addAnnonce()">PUBLIER</button>
                </div>
                <div id="list-annonces"></div>
            </section>

            <section id="page-citoyens" class="mdt-page" style="display:none;">
                <h1>Base de Données Civile</h1>
                <div class="card">
                    <h3>Enregistrer un Civil</h3>
                    <div class="grid-inputs">
                        <input type="text" id="civ-prenom" placeholder="Prénom">
                        <input type="text" id="civ-nom" placeholder="Nom">
                        <input type="text" id="civ-tel" placeholder="Téléphone">
                        <input type="text" id="civ-naiss" placeholder="Naissance">
                    </div>
                    <button onclick="addCivil()">VALIDER DANS LE SYSTÈME</button>
                </div>
                <div id="list-citoyens" class="grid"></div>
            </section>

            <section id="page-effectifs" class="mdt-page" style="display:none;">
                <h1>Annuaire du Département</h1>
                <div class="card" id="form-sasp" style="display:none;">
                    <h3>Recrutement d'un agent</h3>
                    <input type="text" id="new-prenom" placeholder="Prénom">
                    <input type="text" id="new-nom" placeholder="Nom">
                    <input type="text" id="new-mat" placeholder="Matricule">
                    <input type="text" id="new-grade" placeholder="Grade">
                    <button onclick="addNewAgent()">INSCRIRE L'AGENT</button>
                </div>
                <div id="list-sasp" class="grid"></div>
            </section>
        </main>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
