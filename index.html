<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>MDT SASP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wallpaper"></div>

    <div id="login-overlay">
        <div class="auth-box">
            <img src="https://i.imgur.com/wasey9r.png" width="100">
            <div id="auth-fields">
                <input type="text" id="officer-id" placeholder="MATRICULE">
                <input type="password" id="access-code" placeholder="MOT DE PASSE">
                <button onclick="checkLogin()">CONNEXION</button>
                <p class="link" onclick="toggleRegister(true)">Créer un compte</p>
            </div>
            <div id="register-fields" style="display:none;">
                <input type="text" id="reg-nom" placeholder="NOM">
                <input type="text" id="reg-mat" placeholder="MATRICULE">
                <input type="password" id="reg-pass" placeholder="MOT DE PASSE">
                <button onclick="handleRegister()">ENREGISTRER</button>
                <p class="link" onclick="toggleRegister(false)">Retour</p>
            </div>
        </div>
    </div>

    <div id="mdt-app">
        <div class="sidebar">
            <div class="logo-area"><img src="https://i.imgur.com/wasey9r.png" class="sidebar-logo"></div>
            
            <div id="panic-btn" onclick="triggerPanic()">PANIC BUTTON</div>
            
            <nav>
                <div class="nav-item active" data-page="page-dashboard">DASHBOARD</div>
                <div class="nav-item" data-page="page-citoyens">FICHIER CIVIL</div>
            </nav>
            <div id="display-name"></div>
        </div>

        <main class="content">
            <div id="panic-zone"></div>

            <section id="page-dashboard" class="mdt-page">
                <h1 class="page-title">Unités en service</h1>
                <div id="list-units" class="card"></div>
            </section>

            <section id="page-citoyens" class="mdt-page" style="display:none;">
                <h1 class="page-title">Fichier Civil</h1>
                <div class="card">
                    <input type="text" id="civ-prenom" placeholder="Prénom">
                    <input type="text" id="civ-nom" placeholder="Nom">
                    <button onclick="addCivil()">CRÉER LA FICHE</button>
                </div>
                <div id="list-citoyens" class="grid-list"></div>
            </section>
        </main>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
