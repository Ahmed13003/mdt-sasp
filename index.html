<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>SASP MDT - ULTIMATE</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="wallpaper"></div>

    <div id="login-overlay">
        <div class="auth-box">
            <img src="https://i.imgur.com/wasey9r.png" style="width:120px; margin-bottom:20px;">
            <div id="auth-fields">
                <input type="text" id="officer-id" placeholder="MATRICULE">
                <input type="password" id="access-code" placeholder="MOT DE PASSE">
                <button onclick="checkLogin()">CONNEXION</button>
                <p onclick="toggleRegister(true)" style="color:var(--accent); cursor:pointer; margin-top:20px;">DEMANDER ACCÈS</p>
            </div>
            <div id="register-fields" style="display:none;">
                <input type="text" id="reg-prenom" placeholder="PRÉNOM">
                <input type="text" id="reg-nom" placeholder="NOM">
                <input type="text" id="reg-mat" placeholder="MATRICULE">
                <input type="password" id="reg-pass" placeholder="MOT DE PASSE">
                <button onclick="handleRegister()">ENVOYER</button>
                <p onclick="toggleRegister(false)" style="color:gray; cursor:pointer; margin-top:20px;">RETOUR</p>
            </div>
        </div>
    </div>

    <div id="mdt-app">
        <div class="sidebar">
            <div class="logo-area">
                <img src="https://i.imgur.com/wasey9r.png" class="sidebar-logo">
                <div style="font-weight:bold; letter-spacing:2px; margin-top:10px;">SASP TERMINAL</div>
            </div>
            
            <div id="service-btn" class="service-status" onclick="toggleService()">HORS SERVICE</div>
            
            <nav>
                <div class="nav-item active" data-page="page-dashboard"><i class="fas fa-desktop"></i> DASHBOARD</div>
                <div class="nav-item" data-page="page-citoyens"><i class="fas fa-users"></i> FICHIER CIVIL</div>
                <div class="nav-item" data-page="page-penal"><i class="fas fa-book"></i> CODE PÉNAL</div>
                <div class="nav-item" data-page="page-bolo"><i class="fas fa-exclamation-triangle"></i> BOLO / RECHERCHES</div>
                <div class="nav-item" data-page="page-effectifs"><i class="fas fa-shield-alt"></i> EFFECTIF</div>
            </nav>

            <div id="display-name" style="margin-top:auto; padding:30px; font-weight:bold; border-top:1px solid var(--border);"></div>
        </div>

        <main class="content">
            <section id="page-dashboard" class="mdt-page">
                <h1>Tableau de Bord</h1>
                <div class="grid">
                    <div class="card">
                        <h3>UNITÉS EN SERVICE</h3>
                        <div id="list-units" style="font-size:1.4rem; margin-top:20px;"></div>
                    </div>
                    <div class="card">
                        <h3>AVIS DE RECHERCHE ACTIFS</h3>
                        <div id="dash-bolo"></div>
                    </div>
                </div>
            </section>

            <section id="page-citoyens" class="mdt-page" style="display:none;">
                <h1>Fichier Civil</h1>
                <div class="card" style="margin-bottom:20px;">
                    <h3>Enregistrer un citoyen</h3>
                    <div class="grid" style="grid-template-columns: 1fr 1fr; margin-top:15px;">
                        <input type="text" id="civ-prenom" placeholder="Prénom">
                        <input type="text" id="civ-nom" placeholder="Nom">
                    </div>
                    <button onclick="addCivil()">ENREGISTRER</button>
                </div>
                <div id="list-citoyens" class="grid"></div>
            </section>

            <section id="page-penal" class="mdt-page" style="display:none;">
                <h1>Code Pénal SASP</h1>
                <div class="card" style="padding:0;">
                    <iframe src="https://docs.google.com/spreadsheets/d/1y8_DfJ5J2IZmJUKPhc2HxbjzdUaMcxbdg1fYA-dF8EI/preview"></iframe>
                </div>
            </section>

            <section id="page-bolo" class="mdt-page" style="display:none;">
                <h1>Avis de Recherche (BOLO)</h1>
                <div class="card" style="margin-bottom:20px;">
                    <h3>Lancer une alerte</h3>
                    <input type="text" id="bolo-sujet" placeholder="Cible (Nom ou Véhicule)">
                    <textarea id="bolo-raison" placeholder="Raison de la recherche..."></textarea>
                    <button onclick="addBolo()">PUBLIER LE BOLO</button>
                </div>
                <div id="list-bolo" class="grid"></div>
            </section>

            <section id="page-effectifs" class="mdt-page" style="display:none;">
                <h1>Gestion Effectif</h1>
                <div id="form-sasp" class="card" style="display:none; margin-bottom:20px;">
                    <input type="text" id="new-prenom" placeholder="Prénom">
                    <input type="text" id="new-nom" placeholder="Nom">
                    <input type="text" id="new-mat" placeholder="Matricule">
                    <input type="text" id="new-grade" placeholder="Grade">
                    <button onclick="addNewAgent()">RECRUTER</button>
                </div>
                <div id="list-sasp" class="grid"></div>
            </section>
        </main>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
