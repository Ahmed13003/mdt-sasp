<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>SASP MDT - ULTIMATE v5</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="wallpaper"></div>

    <div id="login-overlay">
        <div class="auth-box">
            <img src="https://i.imgur.com/wasey9r.png" style="width:100px;">
            <div id="auth-fields">
                <input type="text" id="officer-id" placeholder="MATRICULE">
                <input type="password" id="access-code" placeholder="MOT DE PASSE">
                <button onclick="checkLogin()">CONNEXION</button>
            </div>
        </div>
    </div>

    <div id="mdt-app">
        <div class="sidebar">
            <div class="logo-area">
                <img src="https://i.imgur.com/wasey9r.png" class="sidebar-logo">
                <div style="font-weight:bold; margin-top:10px;">SASP TERMINAL</div>
            </div>
            
            <div id="service-btn" class="service-status" onclick="toggleService()">HORS SERVICE</div>
            <div id="panic-btn" onclick="triggerPanic()">PANIC BUTTON</div>
            
            <nav>
                <div class="nav-item active" data-page="page-dashboard"><i class="fas fa-desktop"></i> DASHBOARD</div>
                <div class="nav-item" data-page="page-citoyens"><i class="fas fa-users"></i> FICHIER CIVIL</div>
                <div class="nav-item" data-page="page-reports"><i class="fas fa-file-invoice"></i> RAPPORTS</div>
                <div class="nav-item" data-page="page-map"><i class="fas fa-map-marked-alt"></i> CARTE PATROUILLE</div>
                <div class="nav-item" data-page="page-penal"><i class="fas fa-book"></i> CODE PÉNAL</div>
                <div class="nav-item" data-page="page-bolo"><i class="fas fa-exclamation-triangle"></i> BOLO</div>
            </nav>
            <div id="display-name" style="padding:20px; font-weight:bold; text-align:center; border-top:1px solid #333;"></div>
        </div>

        <main class="content">
            <div id="panic-zone"></div>

            <section id="page-dashboard" class="mdt-page">
                <h1>Tableau de Bord</h1>
                <div class="grid">
                    <div class="card"><h3>UNITÉS EN SERVICE</h3><div id="list-units"></div></div>
                    <div class="card"><h3>BOLO ACTIFS</h3><div id="dash-bolo"></div></div>
                </div>
            </section>

            <section id="page-reports" class="mdt-page" style="display:none;">
                <h1>Rapports d'Intervention</h1>
                <div class="card" style="margin-bottom:20px;">
                    <h3>Rédiger un nouveau rapport</h3>
                    <input type="text" id="rep-titre" placeholder="Titre de l'intervention (ex: Fusillade à Davis)">
                    <textarea id="rep-contenu" rows="5" placeholder="Résumé détaillé des faits..."></textarea>
                    <button onclick="addReport()">PUBLIER LE RAPPORT</button>
                </div>
                <div id="list-reports" class="grid"></div>
            </section>

            <section id="page-map" class="mdt-page" style="display:none;">
                <h1>Carte des Secteurs</h1>
                <div class="map-container"></div>
            </section>

            <section id="page-citoyens" class="mdt-page" style="display:none;"><h1>Fichier Civil</h1><div id="list-citoyens" class="grid"></div></section>
            <section id="page-penal" class="mdt-page" style="display:none;"><h1>Code Pénal</h1><div class="card" style="padding:0;"><iframe src="https://docs.google.com/spreadsheets/d/1y8_DfJ5J2IZmJUKPhc2HxbjzdUaMcxbdg1fYA-dF8EI/preview"></iframe></div></section>
            <section id="page-bolo" class="mdt-page" style="display:none;"><h1>BOLO</h1><div id="list-bolo" class="grid"></div></section>
        </main>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
