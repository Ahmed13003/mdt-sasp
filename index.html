<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>SASP MDT - COMMANDER</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="wallpaper"></div>

    <div id="login-overlay">
        <div class="auth-box">
            <img src="https://i.imgur.com/wasey9r.png" style="width:100px; margin-bottom:20px;">
            <div id="auth-fields">
                <input type="text" id="officer-id" placeholder="MATRICULE">
                <input type="password" id="access-code" placeholder="MOT DE PASSE">
                <button onclick="checkLogin()">CONNEXION</button>
                <p onclick="toggleRegister(true)" style="color:var(--accent); cursor:pointer; margin-top:15px; text-decoration:underline;">CRÉER UN COMPTE</p>
            </div>
            <div id="register-fields" style="display:none;">
                <input type="text" id="reg-prenom" placeholder="PRÉNOM">
                <input type="text" id="reg-nom" placeholder="NOM">
                <input type="text" id="reg-mat" placeholder="MATRICULE">
                <input type="password" id="reg-pass" placeholder="MOT DE PASSE">
                <button onclick="handleRegister()">ENVOYER DEMANDE</button>
                <p onclick="toggleRegister(false)" style="color:gray; cursor:pointer; margin-top:15px;">RETOUR</p>
            </div>
        </div>
    </div>

    <div id="mdt-app">
        <div class="sidebar">
            <div class="logo-area"><img src="https://i.imgur.com/wasey9r.png" class="sidebar-logo"></div>
            <div id="service-btn" class="service-status" onclick="toggleService()">HORS SERVICE</div>
            <div id="panic-btn" onclick="triggerPanic()">PANIC BUTTON</div>
            <nav>
                <div class="nav-item active" data-page="page-dashboard"><i class="fas fa-home"></i> DASHBOARD</div>
                <div class="nav-item" data-page="page-map"><i class="fas fa-map"></i> CARTE TACTIQUE</div>
                <div class="nav-item" data-page="page-reports"><i class="fas fa-file"></i> RAPPORTS</div>
                <div class="nav-item" data-page="page-bolo"><i class="fas fa-search"></i> BOLO</div>
                <div class="nav-item" data-page="page-citoyens"><i class="fas fa-users"></i> CIVILS</div>
            </nav>
            <div id="display-name" style="margin-top:auto; padding:20px; text-align:center; color:var(--accent); font-weight:bold; border-top:1px solid #333;"></div>
        </div>

        <main class="content">
            <div id="panic-zone"></div>
            <section id="page-dashboard" class="mdt-page">
                <h1>Tableau de Bord</h1>
                <div id="list-units" style="margin-top:20px;"></div>
                <div id="dash-bolo" style="margin-top:20px;"></div>
            </section>
            <section id="page-map" class="mdt-page" style="display:none;">
                <h1>Carte Tactique</h1>
                <div id="tactical-map" class="map-wrapper" onclick="handleMapClick(event)"></div>
            </section>
            <section id="page-reports" class="mdt-page" style="display:none;">
                <h1>Rapports</h1>
                <input type="text" id="rep-titre" placeholder="Titre">
                <textarea id="rep-contenu" rows="4" placeholder="Détails"></textarea>
                <button onclick="addReport()">PUBLIER</button>
                <div id="list-reports" style="margin-top:20px;"></div>
            </section>
            <section id="page-bolo" class="mdt-page" style="display:none;">
                <h1>Avis de Recherche</h1>
                <input type="text" id="bolo-sujet" placeholder="Cible">
                <textarea id="bolo-raison" placeholder="Raison"></textarea>
                <button onclick="addBolo()">LANCER</button>
                <div id="list-bolo" style="margin-top:20px;"></div>
            </section>
            <section id="page-citoyens" class="mdt-page" style="display:none;">
                <h1>Fichier Civil</h1>
                <input type="text" id="civ-prenom" placeholder="Prénom">
                <input type="text" id="civ-nom" placeholder="Nom">
                <button onclick="addCivil()">AJOUTER</button>
                <div id="list-citoyens" style="margin-top:20px;"></div>
            </section>
        </main>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
