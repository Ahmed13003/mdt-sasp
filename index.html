<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>SASP MDT - Online RP</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div id="login-overlay">
        <div id="login-box" class="auth-box">
            <h2>SASP CONNEXION</h2>
            <input type="text" id="officer-id" placeholder="Matricule">
            <input type="password" id="access-code" placeholder="Mot de passe">
            <button onclick="checkLogin()">CONNEXION</button>
            <p onclick="toggleAuth()" class="toggle-link">Créer une demande d'accès</p>
        </div>
        <div id="register-box" class="auth-box" style="display:none;">
            <h2>DEMANDE D'ACCÈS</h2>
            <input type="text" id="reg-prenom" placeholder="Prénom">
            <input type="text" id="reg-nom" placeholder="Nom">
            <input type="text" id="reg-matricule" placeholder="Matricule">
            <input type="password" id="reg-password" placeholder="Mot de passe">
            <button onclick="sendRequest()">ENVOYER</button>
            <p onclick="toggleAuth()" class="toggle-link">Retour</p>
        </div>
    </div>

    <div id="mdt-app" style="display:none;">
        <div class="sidebar">
    <div class="brand">SASP SERVICES</div>
    <nav>
        <div class="nav-item active" data-page="page-dashboard"><i class="fas fa-th-large"></i> Dashboard</div>
        <div class="nav-item" data-page="page-citoyens"><i class="fas fa-address-book"></i> Fichier Civil</div>
        <div class="nav-item" data-page="page-vehicules"><i class="fas fa-car-side"></i> Immatriculations</div>
        <div class="nav-item" id="nav-wanted" style="display:none;" data-page="page-wanted"><i class="fas fa-user-secret"></i> Recherchés</div>
        <div class="nav-item" id="nav-admin" style="display:none;" data-page="page-admin"><i class="fas fa-cog"></i> Système</div>
    </nav>
    <div class="officer-card" style="padding: 20px; border-top: 1px solid var(--border-color); background: rgba(0,0,0,0.2);">
        <p id="display-name" style="font-size: 1rem; color: white;"></p>
        <p id="display-rank" class="rank" style="display: inline-block; margin-top: 5px;"></p>
    </div>
</div>

        <main class="content">
            <section id="page-dashboard" class="mdt-page">
                <h1>Dashboard</h1>
                <div class="card"><h3>Avis de recherche</h3><div id="list-wanted"></div></div>
            </section>

            <section id="page-citoyens" class="mdt-page" style="display:none;">
                <h1>Fichier des Citoyens</h1>
                <div class="card">
                    <h3>Ajouter un Citoyen</h3>
                    <input type="text" id="cit-nom" placeholder="Nom Complet">
                    <input type="text" id="cit-tel" placeholder="Téléphone">
                    <button onclick="addCitoyen()">Ajouter</button>
                </div>
                <div class="card" id="list-citoyens"></div>
            </section>

            <section id="page-vehicules" class="mdt-page" style="display:none;">
                <h1>Fichier des Véhicules</h1>
                <div class="card">
                    <h3>Ajouter un Véhicule</h3>
                    <input type="text" id="veh-plaque" placeholder="Plaque">
                    <input type="text" id="veh-modele" placeholder="Modèle">
                    <button onclick="addVehicule()">Ajouter</button>
                </div>
                <div class="card" id="list-vehicules"></div>
            </section>

            <section id="page-admin" class="mdt-page" style="display:none;">
                <h1>Validation des Comptes</h1>
                <div id="list-pending-users"></div>
            </section>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAvBTVTYSuFjHjMiZYGiFFN4yviglcXDB4",
            authDomain: "mdt-onlinerp.firebaseapp.com",
            projectId: "mdt-onlinerp",
            storageBucket: "mdt-onlinerp.firebasestorage.app",
            messagingSenderId: "102349354657",
            appId: "1:102349354657:web:7085e7db36adec678d22e0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db; // Pour y accéder depuis script.js

        // --- AUTH ---
        window.checkLogin = async () => {
            const id = document.getElementById('officer-id').value;
            const pass = document.getElementById('access-code').value;
            const q = query(collection(db, "users"), where("matricule", "==", id), where("mdp", "==", pass));
            const snap = await getDocs(q);
            if (!snap.empty) {
                const user = snap.docs[0].data();
                if (user.statut === "valide") {
                    window.currentUser = user;
                    document.getElementById('login-overlay').style.display = 'none';
                    document.getElementById('mdt-app').style.display = 'flex';
                    document.getElementById('display-name').innerText = user.prenom + " " + user.nom;
                    const r = document.getElementById('display-rank');
                    r.innerText = user.grade;
                    r.className = "rank-" + user.grade.toLowerCase().replace(/\s+/g, '-');
                    setupPermissions(user);
                    loadData();
                } else { alert("Compte non validé."); }
            } else { alert("Erreur identifiants."); }
        };

        window.sendRequest = async () => {
            await addDoc(collection(db, "users"), {
                prenom: document.getElementById('reg-prenom').value,
                nom: document.getElementById('reg-nom').value,
                matricule: document.getElementById('reg-matricule').value,
                mdp: document.getElementById('reg-password').value,
                statut: "en_attente", grade: "Cadet"
            });
            alert("Demande envoyée !");
            location.reload();
        };

        // --- DATA OPS ---
        window.addCitoyen = async () => {
            await addDoc(collection(db, "citoyens"), { nom: document.getElementById('cit-nom').value, tel: document.getElementById('cit-tel').value });
            loadData();
        };

        window.addVehicule = async () => {
            await addDoc(collection(db, "vehicules"), { plaque: document.getElementById('veh-plaque').value, modele: document.getElementById('veh-modele').value });
            loadData();
        };

        window.deleteEntry = async (col, id) => {
            const g = window.currentUser.grade.toLowerCase();
            if (g.includes("sergent") || g.includes("lieutenant") || g.includes("capitaine") || g.includes("commander")) {
                await deleteDoc(doc(db, col, id));
                loadData();
            } else { alert("Permission insuffisante pour supprimer."); }
        };

        window.toggleAuth = () => {
            const l = document.getElementById('login-box');
            const r = document.getElementById('register-box');
            l.style.display = l.style.display === 'none' ? 'block' : 'none';
            r.style.display = r.style.display === 'none' ? 'block' : 'none';
        };

    </script>
    <script src="script.js"></script>
</body>
</html>
